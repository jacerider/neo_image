field.formatter.settings.neo_image_media:
  type: neo_image.base
  label: 'Neo Image: Media'

field.formatter.settings.neo_image_image:
  type: neo_image.base
  label: 'Neo Image: Image'

neo_image.base:
  type: mapping
  label: Neo Image Base
  mapping:
    image:
      type: mapping
      label: 'Image'
      mapping:
        dimensions:
          type: sequence
          label: 'Dimensions'
          sequence:
            type: neo_image.dimensions
    image_link:
      type: string
      label: Image link
    selection_mode:
      type: string
      label: Selection mode
    amount:
      type: integer
      label: Amount
    offset:
      type: integer
      label: Offset
    reverse:
      type: boolean
      label: Reverse

neo_image.settings:
  type: neo_image
  mapping:
    _core:
      # Added by the config installer; only exists for merging config.
      requiredKey: false
      type: _core_config_info

# Required by neo_settings.schema.yml, which resolves a variation's stored
# settings via `type: neo_settings.settings.[%parent.plugin]`.
neo_settings.settings.neo_image:
  type: neo_image

neo_image:
  type: mapping
  label: 'Neo Image Settings'
  mapping:
    dimensions:
      type: sequence
      label: 'Dimensions'
      sequence:
        type: neo_image.dimensions

neo_image.dimensions:
  type: mapping
  label: 'Neo Image Dimensions'
  mapping:
    width:
      type: integer
      label: Width
      nullable: true
    height:
      type: integer
      label: Height
      nullable: true
    exact:
      type: boolean
      label: Exact
    bg:
      type: string
      label: Background
      nullable: true
